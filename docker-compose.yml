# Run both services with one command:
#   docker compose up
#
# - api  : FastAPI moderation service on http://localhost:8000  (for your app)
# - ui   : Gradio web UI on http://localhost:7860               (for humans)
#
# Tune any threshold via environment variables — see integrations/README.md
# for the full list. Defaults below match production.

services:
  api:
    build: .
    image: moderationkit:latest
    container_name: moderationkit-api
    ports:
      - "127.0.0.1:8000:8000"   # only through the web server in front, which checks the key
    tmpfs:
      - /tmp                    # checked photos never land on disk
    mem_limit: 3g
    environment:
      # Profile photos are small (256x256): checking them at 640, the size the detector was
      # trained at, avoids the false alarms from enlarging them 4x, and is 2.5x faster.
      MOD_INFERENCE_RESOLUTION: "640"
      MOD_DROP_BY_FACE: "false"
      MOD_CONFLICT_IOU: "1.01"
      MOD_FORMATS: "JPEG"
      MOD_MAX_SIDE: "2048"
      MOD_DISPLAY_THRESHOLD: "0.15"
      MOD_NSFW_BLOCK: "0.70"
      MOD_NSFW_REVIEW: "0.30"
      MOD_EXPLICIT_BLOCK: "0.50"
      MOD_EXPLICIT_REVIEW: "0.20"
      MOD_MALE_BOOST: "2.5"
      MOD_MAX_IMAGE_BYTES: "15728640"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ui:
    image: moderationkit:latest
    container_name: moderationkit-ui
    depends_on:
      - api
    profiles: ["manual"]        # the UI has no key; start it only on purpose, locally
    ports:
      - "127.0.0.1:7860:7860"
    command: ["python", "app.py", "--host", "0.0.0.0"]
    restart: unless-stopped
